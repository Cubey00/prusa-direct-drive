# machine_settings.toml
# All values that depend on the physical setup (printer, stops, sensor, mount, camera, plates).
# Change them HERE, not in the code: the code reads this file at start-up (machine_settings.py).
#
# Units: mm, grams, mm/s. Coordinates:
#   bed     = PrusaSlicer bed coordinates: origin front-left of the print area, +X right, +Y back
#   machine = printer coordinates as reported by M114 / the metrics stream (head position)
# Higher Z = LOWER bed (Core One moves the bed).
#
# Values marked "TODO measure" are first guesses: measure them and set `measured = true`,
# then the software stops warning about them.

[printer]
model = "COREONE"
bed_size = [250.0, 220.0]          # print area (X, Y)
z_max = 273.0                      # lowest safe bed position (gantry_controls.Z_MAX)
# Where the head (nozzle) can go, in machine coordinates. The spacer blocks on the rail ends stop
# it 51 mm early on the right (X max) and 61 mm early at the front (Y min, door side); the team's
# firmware (Cubey00/prusa-direct-drive-firmware, 6.10.100) uses the same limits. Keep these in
# step with X_STOP_SPACER / Y_STOP_SPACER there.
travel_x = [-2.0, 201.0]
travel_y = [42.0, 221.0]

[prusalink]
# Network address of the printer for printing and status (docs/connecting-the-printer.md: direct
# cable, printer fixed at 192.168.50.2). The app uses these unless "Printer settings..." overrides
# them. The password is NOT kept here: it is entered once in the app and stays on that laptop.
host = "192.168.50.2"
user = "maker"

[printing]
# Filament loaded in the printer, as a PrusaSlicer preset name for this printer and nozzle
# (e.g. "Generic PLA @COREONE HF0.4", "Generic PETG @COREONE HF0.4"). Taken from PrusaSlicer's
# own profile bundle, on top of slicing/profiles/coreone.ini. "" = the filament in that profile.
# The Print plates box can pick another one per laptop.
filament = "Generic PETG @COREONE HF0.4"
# Bed levelling before each print. Prusa's own start G-code probes the whole first layer plus
# about 30 mm around it (42 points on our plates). We don't print that precisely: the printer
# probes only these spots (bed X/Y in mm; each snaps to the nearest point of the printer's probe
# grid) and fills in the rest of the mesh itself. [] = Prusa's full probing.
bed_probe_points = [[10, 66], [190, 66], [10, 169], [190, 169], [100, 117]]
# After the bed reaches its temperature, wait until the whole bed frame has warmed up as well
# ("Absorbing heat" on the printer's screen). Takes minutes from a cold bed; false skips it.
wait_for_bed_frame = false
# Purge line at the start of every print. Prusa's start G-code draws it at the very front right
# (X 249 -> 199, Y -2.5), which the spacer blocks make unreachable (nozzle X -2..201, Y 42..221):
# the nozzle then starts the parts empty. It is moved into the front strip instead, in front of
# the usable area and away from the G28 probe points (X 189-194): from purge_start_x 50 mm to the
# left, at purge_y; the nozzle cleaning (G29 P9) and the probe box of the purge place move along.
purge_start_x = 80.0
purge_y = 47.0

[work_area]
# Plates and fiducials stay inside this rectangle (bed coordinates). It must be reachable by the
# NOZZLE (to print: [printer] travel) and by the SENSOR (to measure: travel + [sensor] offset);
# both are checked at start-up. With the sensor 40 mm in front of the nozzle it reaches at most
# Y 221 - 40 = 181, hence the back edge at 179.
# The front edge starts at Y 56: on every G28 the nozzle probes the bed at the firmware's Z homing
# point and sheet check point (probe_points), so nothing may be printed within 3 mm of them.
usable_x = [0.0, 200.0]
usable_y = [56.0, 179.0]
probe_points = [[189.0, 52.0], [194.0, 44.0]]   # firmware Z_SAFE_HOMING / DETECT_PRINT_SHEET (X, Y)

[raster]
margin_x = 20.0                    # free strip left and right inside the usable area (fiducials)
margin_y = 5.0                     # free strip front and back
cell_pitch = 20.0                  # mm between neighbouring cell centres
min_gap = 5.0                      # mm free between a part and the edge of the next cell
max_part_height = 50.0             # taller parts are refused

[fiducials]
# Cones printed on every plate: F1 front-left, F2 front-right, F3 back-left of the usable area.
inset = 10.0                       # mm from the usable area's edges to the cone axis
base_diameter = 8.0
height = 5.0                       # tip height above the bed

[sensor]
# Where the sensor's touch point (centre of the polymer / camera axis) is relative to the nozzle
# tip, in mm along the machine axes: sensor = nozzle + offset.
#   offset_x > 0: sensor to the right of the nozzle
#   offset_y < 0: sensor IN FRONT of the nozzle (towards the door)
#   offset_z < 0: sensor LOWER than the nozzle
# First guess: 40 mm in front and 80 mm below the nozzle. TODO measure (docs/calibration-plan.md,
# step A1); "Start calibration" can save new values here. Used to send the sensor to the
# fiducials, to keep it clear of the plate, and to check the usable area.
mount = "side mount"               # which bracket is fitted (side mount / fan mount V2)
offset_x = 0.0
offset_y = -40.0
offset_z = -62.3
measured = false
hover_clearance = 10.0             # mm the sensor stays above the plate (cones, parts) when it travels
# Size of the sensor housing, for clearance checks between neighbouring parts. TODO measure.
housing_diameter = 50.0
polymer_protrusion = 5.0           # how far the polymer sticks out below the housing

[camera]
# Camera inside the sensor. mm per pixel at the polymer surface, and the pixel where the touch
# point (sensor axis) appears. TODO measure (step A2).
mm_per_px = 0.0
centre_px = [0.0, 0.0]
measured = false

[forces]
contact_g = 5.0                    # |force| that counts as contact
max_force_g = 1100.0               # a touch is aborted above this (Measure allows presses up to 1000 g)
guard_trip_g = 1200.0              # force_guard: emergency drop above this (above max_force_g)
guard_release_g = 50.0             # ...until the force is below this
guard_drop_mm = 30.0               # ...but never more than this far (mm) per trip
# Measure "Move very slowly until the sensor touches the object": the load cell drifts, so contact is
# a quick rise (a peak), not a level: the force must rise contact_rise_g above its average of
# contact_rise_s..2*contact_rise_s seconds earlier. Slow drift never does that; a contact at
# 0.1 mm/s (~100 g/mm: ~10 g/s) does within about a second. Above jog_stop_g it stops anyway.
contact_rise_g = 10.0
contact_rise_s = 1.0
# Against false contacts in the air: the rise must last contact_hold_s (a spike from the motor or
# noise does not), and after the stop the force must still be up contact_verify_s later (at least
# half of contact_rise_g); if not, the bed goes on. The known-free part of the way (1.5 of the 3 mm
# below the hover, pathprogrammer/measure.py) only stops at jog_stop_g.
contact_hold_s = 0.2
contact_verify_s = 0.3
jog_stop_g = 100.0                 # calibrator: "Bed up" refused above this (load cell drifts: well above contact_g)

[calibration]
min_distance = 10.0                # mm: calibration points closer than this are refused
scale_tol = 0.02                   # warn if the fitted scale differs more than this from 1
residual_tol = 0.5                 # mm: warn if a point is further than this off the 3-point fit
# Head position (machine X, Y, Z in mm) where the sensor stood on each cone in the last good
# calibration; "Start calibration" saves them. The sensor sits the same way every time, so the
# next calibration drives straight there, [sensor] hover_clearance higher, instead of predicting
# it from the offset. [] = not known yet. They hold as long as the cones stay where they are
# ([work_area], [fiducials]); clear them after changing those.
cone_F1 = [-1.019, 104.316, 67.175]
cone_F2 = [176.959, 104.863, 67.425]
cone_F3 = []

[focusfield]
# Deliberately disabled. Measure the optical fixture independently before enabling.
# These values do NOT inherit the tactile camera scale or sensor calibration.
enabled = false
measured = false
fixture_id = "unconfigured"
calibration_id = "unconfigured"
camera_serial = ""
firmware_id = ""
safe_z_min_mm = 0.0
safe_z_max_mm = 0.0
reference_z_mm = 0.0
reference_wd_mm = 20.0
minimum_wd_mm = 5.0
wd_uncertainty_mm = 0.0
position_tolerance_mm = 0.02
z_speed_mm_s = 1.0
motion_safety_verified = false
camera_pipeline_verified = false
verified_pixel_format = ""        # native format verified for this camera and pipeline, e.g. "Mono16"
frame_timing_verified = false
wd_reference_record = ""
sfr_reference_verified = false
sfr_validation_id = ""
# Nominal lens for the Focus-Field visible field (chart size) until a lens.json is loaded.
# Lensation B10M3218S123C (S-mount, f 3.2 mm, H 117 / V 86 deg) on an IDS U3-38L1XLS-C
# (Sony IMX412, 4056 x 3040 px of 1.55 um). Fisheye: field = 2 x WD x tan(half sensor / f).
lens_focal_mm = 3.2
pixel_size_um = 1.55
